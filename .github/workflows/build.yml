name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Clean & Bypass Google Services / Signing
        run: |
          # 1. إزالة استدعاء إضافة google-services من ملفات البناء إن وجدت لتفادي أي فحص
          sed -i '/alias(libs.plugins.google.gms.google.services)/d' app/build.gradle.kts || true
          sed -i '/id("com.google.gms.google-services")/d' app/build.gradle.kts || true
          sed -i '/apply plugin:.*google-services/d' app/build.gradle.kts || true
          
          # 2. إنشاء مفتاح debug.keystore في كل المسارات المحتملة
          keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp app/debug.keystore ./debug.keystore || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon -x test -x lint -x validateSigningDebug -x processDebugGoogleServices
          else
            gradle assembleDebug --no-daemon -x test -x lint -x validateSigningDebug -x processDebugGoogleServices
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mo7adaraty-app
          path: app/build/outputs/apk/debug/*.apk
